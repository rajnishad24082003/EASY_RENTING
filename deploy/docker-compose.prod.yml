# Production override for a tiny server: Oracle Cloud Always Free VM.Standard.E2.1.Micro (1 GB RAM, x86).
# Images are built on your laptop and copied over by deploy/deploy.sh. The server only runs them.
#
# Differences from the dev setup:
# - Only Caddy is reachable from the internet (ports 80/443, automatic HTTPS).
# - Every service is squeezed to fit in 1 GB of RAM (plus swap). It is slow, but it runs.

services:
  postgres:
    ports: !reset []
    restart: always
    command: >
      postgres -c shared_buffers=32MB -c max_connections=20 -c work_mem=2MB
      -c maintenance_work_mem=32MB -c effective_cache_size=128MB

  backend:
    image: easyrenting-backend:latest
    ports: !reset []
    restart: always
    environment:
      TRUST_PROXY: "true"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      JAVA_TOOL_OPTIONS: >-
        -Xmx256m -Xss512k -XX:MaxMetaspaceSize=200m -XX:+UseSerialGC
        -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError

  frontend:
    image: easyrenting-frontend:latest
    ports: !reset []
    restart: always
    environment:
      NODE_OPTIONS: --max-old-space-size=160

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - frontend
      - backend
    environment:
      SITE_HOST: ${SITE_HOST:?SITE_HOST must be set in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
