spring:
  application:
    name: easyrenting-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/easyrenting}
    username: ${DB_USERNAME:easyrenting}
    password: ${DB_PASSWORD:easyrenting}
    hikari:
      pool-name: easyrenting-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 80MB
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: EasyRenting API
    version: '@project.version@'

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  pattern:
    level: '%5p [%X{requestId:-}]'
  level:
    com.easyrenting: INFO

app:
  timezone: Asia/Kolkata
  trust-proxy: ${TRUST_PROXY:false}
  jwt:
    # Dev-only fallback; the prod profile requires JWT_SECRET to be provided.
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-please-0123456789}
    issuer: easyrenting
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  cookie:
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5-5
    timeout: 15s
    cache-ttl: 1h
    cache-max-size: 2000
  rate-limit:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20

app:
  jwt:
    secret: ${JWT_SECRET}
  cookie:
    secure: ${COOKIE_SECURE:true}

logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: demo

logging:
  level:
    com.easyrenting.seed: INFO

---
spring:
  config:
    activate:
      on-profile: test

app:
  jwt:
    secret: test-secret-that-is-definitely-longer-than-32-bytes
  storage:
    local-dir: ${java.io.tmpdir}/easyrenting-test-uploads
  rate-limit:
    enabled: false
